<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Achtergrond gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2DB56B"/>
      <stop offset="100%" stop-color="#0E8A4B"/>
    </linearGradient>

    <!-- Zon gradient -->
    <radialGradient id="sunGrad" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFF8D6"/>
      <stop offset="30%" stop-color="#FDE173"/>
      <stop offset="100%" stop-color="#F5B82E"/>
    </radialGradient>

    <!-- Zonnepaneel gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E4D8C"/>
      <stop offset="100%" stop-color="#0D2652"/>
    </linearGradient>

    <!-- Glans highlight op panelen -->
    <linearGradient id="highlightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- 1. Achtergrond (afgeronde vierkant) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- 2. Zonnestralen -->
  <g stroke="#FFDE59" stroke-width="14" stroke-linecap="round">
    <!-- Hoofdstralen (boven, rechts, onder, links) -->
    <line x1="256" y1="70" x2="256" y2="100" />
    <line x1="386" y1="200" x2="356" y2="200" />
    <line x1="256" y1="330" x2="256" y2="300" />
    <line x1="126" y1="200" x2="156" y2="200" />
    
    <!-- Diagonale stralen (via rotatie) -->
    <line x1="256" y1="70" x2="256" y2="100" transform="rotate(45 256 200)" />
    <line x1="256" y1="70" x2="256" y2="100" transform="rotate(135 256 200)" />
    <line x1="256" y1="70" x2="256" y2="100" transform="rotate(225 256 200)" />
    <line x1="256" y1="70" x2="256" y2="100" transform="rotate(315 256 200)" />
  </g>

  <!-- 3. Zon lichaam -->
  <circle cx="256" cy="200" r="70" fill="url(#sunGrad)"/>
  
  <!-- Zon highlight (glimmend randje) -->
  <ellipse cx="235" cy="175" rx="20" ry="12" fill="#FFFFFF" opacity="0.5" transform="rotate(-30 235 175)"/>

  <!-- 4. Zonnepaneel Frame -->
  <rect x="96" y="320" width="320" height="140" rx="16" fill="#0B1B2C" />

  <!-- 5. Zonnepaneel Cellen (2x2 grid) -->
  <!-- Bovenste rij -->
  <rect x="106" y="330" width="145" height="55" rx="8" fill="url(#panelGrad)"/>
  <rect x="261" y="330" width="145" height="55" rx="8" fill="url(#panelGrad)"/>
  
  <!-- Onderste rij -->
  <rect x="106" y="395" width="145" height="55" rx="8" fill="url(#panelGrad)"/>
  <rect x="261" y="395" width="145" height="55" rx="8" fill="url(#panelGrad)"/>

  <!-- 6. Glans / Highlights op de panelen -->
  <rect x="106" y="330" width="145" height="25" rx="8" fill="url(#highlightGrad)"/>
  <rect x="261" y="330" width="145" height="25" rx="8" fill="url(#highlightGrad)"/>
  <rect x="106" y="395" width="145" height="25" rx="8" fill="url(#highlightGrad)"/>
  <rect x="261" y="395" width="145" height="25" rx="8" fill="url(#highlightGrad)"/>

  <!-- 7. Standaard en voet van het zonnepaneel -->
  <rect x="244" y="460" width="24" height="20" fill="#0B1B2C" />
  <rect x="210" y="480" width="92" height="12" rx="6" fill="#0B1B2C" />
</svg>